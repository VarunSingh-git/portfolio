<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081410"/>
      <stop offset="50%" stop-color="#12251D"/>
      <stop offset="100%" stop-color="#06120D"/>
    </linearGradient>
    <pattern id="gridPattern4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#162D23" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgRate)"/>
  <rect width="800" height="500" fill="url(#gridPattern4)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="none" stroke="#264436" stroke-width="2"/>
  <circle cx="45" cy="45" r="5" fill="#EFA12D"/>
  <circle cx="62" cy="45" r="5" fill="#10B981"/>
  <circle cx="79" cy="45" r="5" fill="#38BDF8"/>
  <text x="105" y="49" fill="#A6B6A0" font-family="monospace" font-size="12" font-weight="bold">RATE_LIMITER // REDIS_TOKEN_BUCKET</text>
  <rect x="620" y="34" width="140" height="24" rx="12" fill="#153325" stroke="#38BDF8" stroke-width="1"/>
  <text x="690" y="50" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">⚡ 10K+ REQ/SEC</text>

  <!-- Left: Token Bucket Architecture -->
  <g transform="translate(60, 95)">
    <rect width="320" height="295" rx="14" fill="#0C2018" stroke="#1F4232" stroke-width="1.5"/>
    <text x="25" y="40" fill="#F5ECDD" font-family="sans-serif" font-size="18" font-weight="bold">Sliding-Window Bucket</text>
    <text x="25" y="60" fill="#A6B6A0" font-family="monospace" font-size="12">Atomic Lua Script Execution</text>

    <!-- Bucket Graphic -->
    <g transform="translate(25, 80)">
      <rect width="270" height="90" rx="8" fill="#132B21" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="20" y="32" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="bold">AVAILABLE TOKENS: 60 / 60</text>
      <!-- Progress Bar -->
      <rect x="20" y="45" width="230" height="12" rx="6" fill="#091712"/>
      <rect x="20" y="45" width="200" height="12" rx="6" fill="#38BDF8"/>
      <text x="20" y="75" fill="#A6B6A0" font-family="monospace" font-size="11">Window: 60s Sliding Interval</text>
    </g>

    <g transform="translate(25, 185)">
      <rect width="270" height="40" rx="6" fill="#081711" stroke="#1F4232"/>
      <text x="15" y="25" fill="#F5ECDD" font-family="monospace" font-size="12">Burst Defense Status</text>
      <text x="255" y="25" fill="#10B981" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">GUARDED</text>

      <rect y="48" width="270" height="40" rx="6" fill="#081711" stroke="#1F4232"/>
      <text x="15" y="73" fill="#F5ECDD" font-family="monospace" font-size="12">Fallback LRU Cache</text>
      <text x="255" y="73" fill="#EFA12D" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">HOT_READY</text>
    </g>
  </g>

  <!-- Right: Metrics & Burst Rejection -->
  <g transform="translate(410, 95)">
    <rect width="330" height="295" rx="14" fill="#0E271E" stroke="#38BDF8" stroke-width="2"/>
    
    <rect x="25" y="25" width="280" height="85" rx="12" fill="#081711" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="40" y="55" fill="#A6B6A0" font-family="monospace" font-size="11" font-weight="bold">PEAK THROUGHPUT BENCHMARK</text>
    <text x="40" y="94" fill="#38BDF8" font-family="sans-serif" font-size="32" font-weight="bold">&lt; 1.8 ms Latency</text>

    <g transform="translate(25, 130)">
      <rect width="280" height="40" rx="8" fill="#132B21"/>
      <text x="15" y="25" fill="#F5ECDD" font-family="monospace" font-size="12">Excessive Request Filter</text>
      <text x="265" y="25" fill="#EFA12D" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">HTTP 429</text>

      <rect y="50" width="280" height="40" rx="8" fill="#132B21"/>
      <text x="15" y="75" fill="#F5ECDD" font-family="monospace" font-size="12">Redis Memory Footprint</text>
      <text x="265" y="75" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">&lt; 24 MB</text>

      <rect y="100" width="280" height="34" rx="6" fill="#153627" stroke="#10B981" stroke-width="1"/>
      <text x="140" y="122" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">DDOS PACIFIER: FULLY ARMORED</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <rect x="60" y="410" width="680" height="46" rx="8" fill="#0C1F17" stroke="#1F4232"/>
  <text x="85" y="438" fill="#F5ECDD" font-family="sans-serif" font-size="13" font-weight="bold">REDIS CLUSTER READY</text>
  <text x="320" y="438" fill="#38BDF8" font-family="monospace" font-size="12">• LUA ATOMICITY</text>
  <text x="540" y="438" fill="#EFA12D" font-family="monospace" font-size="12">• ZERO BOT PENETRATION</text>
</svg>

