<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081410"/>
      <stop offset="50%" stop-color="#10251E"/>
      <stop offset="100%" stop-color="#06120D"/>
    </linearGradient>
    <pattern id="gridPattern2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#162D23" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgBill)"/>
  <rect width="800" height="500" fill="url(#gridPattern2)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="none" stroke="#264436" stroke-width="2"/>
  <circle cx="45" cy="45" r="5" fill="#EFA12D"/>
  <circle cx="62" cy="45" r="5" fill="#10B981"/>
  <circle cx="79" cy="45" r="5" fill="#38BDF8"/>
  <text x="105" y="49" fill="#A6B6A0" font-family="monospace" font-size="12" font-weight="bold">LEDGER_CALC // POSTGRES_DECIMAL_SAFE</text>
  <rect x="615" y="34" width="145" height="24" rx="12" fill="#153325" stroke="#EFA12D" stroke-width="1"/>
  <text x="687" y="50" fill="#EFA12D" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">★ ZERO_FLOAT_DRIFT</text>

  <!-- Left Side: Table & Order State Machine (Bold Cards) -->
  <g transform="translate(60, 95)">
    <rect width="320" height="295" rx="14" fill="#0C2018" stroke="#1F4232" stroke-width="1.5"/>
    <text x="25" y="40" fill="#F5ECDD" font-family="sans-serif" font-size="18" font-weight="bold">Order State Machine</text>
    <text x="25" y="60" fill="#A6B6A0" font-family="monospace" font-size="12">ACID Table Session Transitions</text>

    <!-- Table Pill Badges -->
    <g transform="translate(25, 80)">
      <rect width="85" height="45" rx="8" fill="#183B2E" stroke="#10B981" stroke-width="1.5"/>
      <text x="42" y="107" fill="#34D399" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">TABLE 04</text>
      
      <rect x="95" width="85" height="45" rx="8" fill="#162D23" stroke="#264A38"/>
      <text x="137" y="107" fill="#A6B6A0" font-family="monospace" font-size="14" text-anchor="middle">TABLE 05</text>

      <rect x="190" width="85" height="45" rx="8" fill="#162D23" stroke="#264A38"/>
      <text x="232" y="107" fill="#A6B6A0" font-family="monospace" font-size="14" text-anchor="middle">TABLE 09</text>
    </g>

    <!-- State Progression Visual -->
    <g transform="translate(25, 145)">
      <rect width="270" height="34" rx="6" fill="#132F23" stroke="#EFA12D" stroke-width="1"/>
      <circle cx="20" cy="17" r="6" fill="#EFA12D"/>
      <text x="36" y="22" fill="#F5ECDD" font-family="monospace" font-size="12" font-weight="bold">KOT_DISPATCH ➔ KITCHEN</text>

      <rect y="44" width="270" height="34" rx="6" fill="#0A1A13" stroke="#1F4232"/>
      <circle cx="20" cy="61" r="6" fill="#10B981"/>
      <text x="36" y="66" fill="#F5ECDD" font-family="monospace" font-size="12">DYNAMIC_SPLIT ➔ 50 / 50</text>

      <rect y="88" width="270" height="34" rx="6" fill="#0A1A13" stroke="#1F4232"/>
      <circle cx="20" cy="105" r="6" fill="#38BDF8"/>
      <text x="36" y="110" fill="#38BDF8" font-family="monospace" font-size="12">RECONCILED ➔ SETTLED</text>
    </g>
  </g>

  <!-- Right Side: Bold High-Impact Receipt & Math Block -->
  <g transform="translate(410, 95)">
    <rect width="330" height="295" rx="14" fill="#0E271E" stroke="#EFA12D" stroke-width="2"/>
    
    <!-- Bold Amount Callout Banner -->
    <rect x="25" y="25" width="280" height="85" rx="12" fill="#081711" stroke="#EFA12D" stroke-width="1.5"/>
    <text x="45" y="55" fill="#A6B6A0" font-family="monospace" font-size="11" font-weight="bold">TOTAL SETTLED (GST INCLUDED)</text>
    <text x="45" y="94" fill="#EFA12D" font-family="sans-serif" font-size="32" font-weight="bold">₹ 14,850.00</text>

    <!-- Calculation highlights -->
    <g transform="translate(25, 130)">
      <rect width="280" height="35" rx="6" fill="#132B21"/>
      <text x="15" y="22" fill="#F5ECDD" font-family="monospace" font-size="12">Subtotal (34 items)</text>
      <text x="265" y="22" fill="#F5ECDD" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">₹ 12,584.75</text>

      <rect y="45" width="280" height="35" rx="6" fill="#132B21"/>
      <text x="15" y="67" fill="#F5ECDD" font-family="monospace" font-size="12">GST @ 18.00%</text>
      <text x="265" y="67" fill="#10B981" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">+ ₹ 2,265.25</text>

      <rect y="90" width="280" height="35" rx="6" fill="#153627" stroke="#10B981" stroke-width="1"/>
      <text x="15" y="112" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold">ROUNDING ERROR</text>
      <text x="265" y="112" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">0.000000 ¢</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <rect x="60" y="410" width="680" height="46" rx="8" fill="#0C1F17" stroke="#1F4232"/>
  <text x="85" y="438" fill="#F5ECDD" font-family="sans-serif" font-size="13" font-weight="bold">NUMERIC(12,2) ARITHMETIC</text>
  <text x="350" y="438" fill="#EFA12D" font-family="monospace" font-size="12">• THERMAL PRINTER DISPATCH</text>
  <text x="580" y="438" fill="#10B981" font-family="monospace" font-size="12">• ACID ISOLATION</text>
</svg>
