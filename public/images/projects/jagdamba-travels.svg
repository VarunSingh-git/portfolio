<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFleet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07130F"/>
      <stop offset="50%" stop-color="#0F241C"/>
      <stop offset="100%" stop-color="#06120D"/>
    </linearGradient>
    <pattern id="gridPattern3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#162D23" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgFleet)"/>
  <rect width="800" height="500" fill="url(#gridPattern3)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="none" stroke="#264436" stroke-width="2"/>
  <circle cx="45" cy="45" r="5" fill="#EFA12D"/>
  <circle cx="62" cy="45" r="5" fill="#10B981"/>
  <circle cx="79" cy="45" r="5" fill="#38BDF8"/>
  <text x="105" y="49" fill="#A6B6A0" font-family="monospace" font-size="12" font-weight="bold">FLEET_DISPATCH // ROUTE_COLLISION_SHIELD</text>
  <rect x="620" y="34" width="140" height="24" rx="12" fill="#153325" stroke="#10B981" stroke-width="1"/>
  <text x="690" y="50" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">✔ ZERO_OVERLAPS</text>

  <!-- Left Side: Interactive Route Vector Map -->
  <g transform="translate(60, 95)">
    <rect width="330" height="295" rx="14" fill="#0C2018" stroke="#1F4232" stroke-width="1.5"/>
    <text x="25" y="40" fill="#F5ECDD" font-family="sans-serif" font-size="18" font-weight="bold">Multi-City Route Lock</text>
    <text x="25" y="60" fill="#A6B6A0" font-family="monospace" font-size="12">Overlap Detection Pipeline</text>

    <!-- Waypoints Graphic -->
    <g transform="translate(30, 85)">
      <!-- Line path connecting waypoints -->
      <path d="M 25 35 Q 90 10 140 45 T 250 30" fill="none" stroke="#EFA12D" stroke-width="3" stroke-linecap="round"/>
      <path d="M 25 35 Q 90 10 140 45 T 250 30" fill="none" stroke="#34D399" stroke-width="1" stroke-dasharray="4 4"/>

      <!-- Node 1: Delhi -->
      <circle cx="25" cy="35" r="10" fill="#EFA12D"/>
      <circle cx="25" cy="35" r="4" fill="#08120E"/>
      <text x="25" y="65" fill="#F5ECDD" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">DELHI</text>

      <!-- Node 2: Jaipur -->
      <circle cx="140" cy="45" r="12" fill="#10B981"/>
      <circle cx="140" cy="45" r="5" fill="#08120E"/>
      <text x="140" y="77" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">JAIPUR</text>

      <!-- Node 3: Agra -->
      <circle cx="250" cy="30" r="10" fill="#38BDF8"/>
      <circle cx="250" cy="30" r="4" fill="#08120E"/>
      <text x="250" y="60" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">AGRA</text>
    </g>

    <!-- Telemetry status card -->
    <g transform="translate(25, 185)">
      <rect width="280" height="40" rx="8" fill="#132B21" stroke="#264A38"/>
      <text x="15" y="25" fill="#F5ECDD" font-family="monospace" font-size="12">Vehicle: Innova Crysta</text>
      <text x="265" y="25" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">LOCKED</text>

      <rect y="48" width="280" height="40" rx="8" fill="#132B21" stroke="#264A38"/>
      <text x="15" y="73" fill="#F5ECDD" font-family="monospace" font-size="12">Schedule Conflict Query</text>
      <text x="265" y="73" fill="#EFA12D" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">COUNT == 0</text>
    </g>
  </g>

  <!-- Right Side: Bold Dynamic Fare & Automated Alerts -->
  <g transform="translate(415, 95)">
    <rect width="325" height="295" rx="14" fill="#0E271E" stroke="#10B981" stroke-width="2"/>
    
    <!-- Bold Distance & Rate Banner -->
    <rect x="25" y="25" width="275" height="85" rx="12" fill="#081711" stroke="#10B981" stroke-width="1.5"/>
    <text x="40" y="55" fill="#A6B6A0" font-family="monospace" font-size="11" font-weight="bold">ESTIMATED ROUTE FARE</text>
    <text x="40" y="94" fill="#34D399" font-family="sans-serif" font-size="32" font-weight="bold">₹ 9,450.00</text>

    <!-- Dispatch & alerts -->
    <g transform="translate(25, 130)">
      <rect width="275" height="40" rx="8" fill="#132B21"/>
      <text x="15" y="25" fill="#F5ECDD" font-family="monospace" font-size="12">Distance Matrix Engine</text>
      <text x="260" y="25" fill="#EFA12D" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">320 KM</text>

      <rect y="50" width="275" height="40" rx="8" fill="#132B21"/>
      <text x="15" y="75" fill="#F5ECDD" font-family="monospace" font-size="12">Automated Notifications</text>
      <text x="260" y="75" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">EMAIL + SMS</text>

      <rect y="100" width="275" height="34" rx="6" fill="#153627" stroke="#10B981" stroke-width="1"/>
      <text x="137" y="122" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">DOUBLE-BOOKING PROBABILITY: 0%</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <rect x="60" y="410" width="680" height="46" rx="8" fill="#0C1F17" stroke="#1F4232"/>
  <text x="85" y="438" fill="#F5ECDD" font-family="sans-serif" font-size="13" font-weight="bold">30+ FLEET ROUTES</text>
  <text x="320" y="438" fill="#EFA12D" font-family="monospace" font-size="12">• MONGODB DATE-RANGE LOCKS</text>
  <text x="580" y="438" fill="#10B981" font-family="monospace" font-size="12">• ZERO OVERLAPS</text>
</svg>
